# Public zero-credential ATS search defaults for the personal assistant.
# This is a source configuration, not a candidate profile.
title_filter:
  positive:
    - "AI Engineer"
    - "Artificial Intelligence"
    - "Machine Learning"
    - "ML Engineer"
    - "Data Engineer"
    - "Data Scientist"
    - "Data Science"
    - "GenAI"
    - "Generative AI"
    - "LLM"
    - "RAG"
    - "Intern"
    - "Internship"
    - "Stage"
    - "Alternance"
    - "Apprentice"
    - "Software Engineer"
    - "Backend Engineer"
    - "Developer"
    - "Data Analyst"
    - "Engineer"
    - "Engineering"
    - "Analytics"
    - "Research"
    - "Cloud"
    - "DevOps"
  negative:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Director"
